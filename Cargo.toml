[workspace]
resolver = "3"
members = ["crates/mda-core", "crates/mda-vault", "crates/mda-ops", "crates/mda"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
mda-core = { path = "crates/mda-core" }
mda-vault = { path = "crates/mda-vault" }
mda-ops = { path = "crates/mda-ops" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
log = { version = "0.4.33", features = ["std"] }
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
sha2 = { version = "0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"   # stdout is the protocol in `serve`
dbg_macro = "deny"
indexing_slicing = "warn"
cognitive_complexity = "warn"
