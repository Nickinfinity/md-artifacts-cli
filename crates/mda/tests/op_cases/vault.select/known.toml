vault = "vault_bare"
vault_flag = false
machine_config = '''
default = "$OTHER"
vaults = ["$OTHER", "$VAULT"]
'''
params = { path = "$VAULT" }
[expect]
path = "$VAULT"
created = ["Snippets", "AIAgentsConf", "AIPrompts"]
[expect_config_files]
"config.toml" = '''
default = "$VAULT"
vaults = ["$OTHER", "$VAULT"]
'''
