vault = "vault"
params = { path = "Templates/index.md", mirrorFrom = "./src//app" }
expect = { steps = [
  { raw = "edit", relPath = "edit.md", relDir = "", candidates = ["src/app", "src/components"] },
  { raw = "sub/widget.md", relPath = "sub/widget.md", relDir = "sub", candidates = ["src/app/sub", "src/components"] },
  { raw = "edit", relPath = "edit.md", relDir = "", candidates = ["src/app", "src/components"] },
  { raw = "sub/snip", relPath = "sub/snip.md", relDir = "sub", candidates = ["src/app/sub", "src/components"], skip = { code = "artifact.not_whole_file", params = { type = "Snippet" } } },
  { raw = "sub/nested-index", relPath = "sub/nested-index.md", relDir = "sub", candidates = ["src/app/sub", "src/components"], skip = { code = "artifact.is_index", params = {} } },
], rejected = [{ raw = "../x", code = "path.parent_segment" }] }
