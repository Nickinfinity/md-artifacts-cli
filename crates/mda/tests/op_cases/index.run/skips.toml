workspace = "workspace"
params = { path = "Templates/index.md", workspaceRoot = "$WORKSPACE", steps = [
  { relPath = "../AIAgentsConf/reviewer.md", destDir = "" },
  { relPath = "sub/snip.md", destDir = "" },
  { relPath = "sub/nested-index.md", destDir = "" },
  { relPath = "missing.md", destDir = "" },
  { relPath = "component.md", destDir = "out" },
  { relPath = "edit.md", destDir = "../out" },
